<!DOCTYPE html>
<html>
<head>
<title>Book Event</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Book Event</h1>

<form id="bookingForm">

<input type="text"
id="name"
placeholder="Name"
required>

<input type="email"
id="email"
placeholder="Email"
required>

<button type="submit">
Confirm Booking
</button>

</form>

<script>

document
.getElementById("bookingForm")
.addEventListener("submit", async(e)=>{

e.preventDefault();

const booking = {

name:
document.getElementById("name").value,

email:
document.getElementById("email").value

};

const response =
await fetch("/book",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(booking)

});

const result = await response.json();

alert(result.message);

});

</script>

</body>
</html>
